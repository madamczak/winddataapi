[project]
name = "wind-events-crawler"
version = "0.1.0"
description = "Standalone packaged worker foundation for the wind events crawler"
readme = "README.md"
authors = [
    { name = "madamczak", email = "adamczak.mateusz@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.50",
]

[project.scripts]
wind-events-crawler = "wind_events_crawler.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
