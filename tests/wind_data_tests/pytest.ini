[pytest]
addopts = -vv --tb=short --capture=no --disable-warnings --html=./pytest.html --self-contained-html --basetemp=./pytest_temp --browser=chromium --headed --slowmo=2000
python_files = test_*
python_functions = test_*
python_classes = Test*
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_file = pytest.log
console_output_style = count
color = yes
render_collapsed = failed,error,xfailed,passed,xpassed,skipped
